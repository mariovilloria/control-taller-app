<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nuevo usuario</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 560px;
        background: #ffffff;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h2 {
        margin: 0 0 24px 0;
      }

      .error {
        margin-bottom: 18px;
        padding: 12px 14px;
        background: #fee2e2;
        color: #991b1b;
        border-radius: 10px;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: bold;
      }

      .form-group input[type="text"],
      .form-group input[type="password"] {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
      }

      .check-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .acciones {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }

      .btn {
        flex: 1;
        height: 46px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-guardar {
        background: #2563eb;
        color: #ffffff;
      }

      .btn-volver {
        background: #e5e7eb;
        color: #111827;
      }

      @media (max-width: 520px) {
        .card {
          padding: 22px 18px;
        }

        .acciones {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h2>Nuevo usuario</h2>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/usuarios/nuevo">
          <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="usuario" required />
          </div>

          <div class="form-group">
            <label>Nombre</label>
            <input type="text" name="nombre" required />
          </div>

          <div class="form-group">
            <label>Clave</label>
            <input type="password" name="clave" required />
          </div>

          <div class="check-group">
            <input type="checkbox" id="es_admin" name="es_admin" />
            <label for="es_admin">Es administrador</label>
          </div>

          <div class="check-group">
            <input
              type="checkbox"
              id="puede_gestionar"
              name="puede_gestionar"
            />
            <label for="puede_gestionar">Puede gestionar</label>
          </div>

          <div class="check-group">
            <input
              type="checkbox"
              id="puede_crear_trabajos"
              name="puede_crear_trabajos"
            />
            <label for="puede_crear_trabajos">Puede crear trabajos</label>
          </div>

          <div class="check-group">
            <input type="checkbox" id="activo" name="activo" checked />
            <label for="activo">Activo</label>
          </div>

          <div class="acciones">
            <button type="submit" class="btn btn-guardar">Crear usuario</button>
            <a href="/usuarios" class="btn btn-volver">Volver</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
