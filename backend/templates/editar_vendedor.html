<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar vendedor</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
        padding: 24px;
      }

      .page {
        max-width: 760px;
        margin: 0 auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      .btn-volver {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        background: #e5e7eb;
        color: #111827;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
      }

      .card {
        background: #ffffff;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .form-grid {
        display: grid;
        gap: 16px;
      }

      .form-group {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 14px;
        font-weight: bold;
        color: #374151;
      }

      input[type="text"] {
        width: 100%;
        height: 42px;
        padding: 0 12px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
      }

      input[type="text"]:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 6px;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      .btn-primary {
        height: 42px;
        padding: 0 16px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        font-weight: bold;
        cursor: pointer;
      }

      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 42px;
        padding: 0 16px;
        border-radius: 10px;
        background: #e5e7eb;
        color: #111827;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <h2>Editar vendedor</h2>
        <a href="/vendedores" class="btn-volver">Volver</a>
      </div>

      <div class="card">
        <form method="POST" action="/vendedores/{{ vendedor.id }}/actualizar">
          <div class="form-grid">
            <div class="form-group">
              <label for="nombre">Nombre</label>
              <input
                type="text"
                id="nombre"
                name="nombre"
                value="{{ vendedor.nombre }}"
                required
              />
            </div>

            <div class="form-group">
              <label>Activo</label>
              <div class="checkbox-group">
                <input
                  type="checkbox"
                  name="activo"
                  {{ "checked" if vendedor.activo else "" }}
                />
                <span>Mostrar en el panel</span>
              </div>
            </div>
          </div>

          <div class="actions">
            <button type="submit" class="btn-primary">
              Guardar cambios
            </button>
            <a href="/vendedores" class="btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
