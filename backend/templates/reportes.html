<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Reportes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/reportes.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
  </head>
  <body>
    <h1>Reportes</h1>

    <h2>Productividad por técnico</h2>

    <div class="filtros-reportes">
      <div class="filtro-item">
        <label for="filtroTecnico">Técnico</label><br />
        <select
          id="filtroTecnico"
          onchange="recalcularProductividadDesdeMemoria()"
        >
          <option value="">Todos</option>
        </select>
      </div>

      <div class="filtro-item">
        <label for="filtroTipoResponsable">Origen</label><br />
        <select
          id="filtroTipoResponsable"
          onchange="recalcularProductividadDesdeMemoria()"
        >
          <option value="">Todos</option>
          <option value="vendedor">Vendedores</option>
          <option value="interno">Interno</option>
        </select>
      </div>

      <div class="filtro-item">
        <label for="filtroResponsable">Responsable</label><br />
        <select
          id="filtroResponsable"
          onchange="recalcularProductividadDesdeMemoria()"
        >
          <option value="">Todos</option>
        </select>
      </div>

      <div class="filtro-item">
        <label for="filtroFechaRango">Fecha</label><br />
        <input
          type="text"
          id="filtroFechaRango"
          placeholder="Seleccionar rango"
          readonly
        />
        <input type="hidden" id="filtroFechaDesde" />
        <input type="hidden" id="filtroFechaHasta" />
      </div>

      <div class="filtro-item filtro-acciones">
        <button type="button" onclick="limpiarFiltrosReportes()">
          Limpiar
        </button>
      </div>
    </div>
    <div id="resumen-general-reportes" class="resumen-general-reportes"></div>
    <div id="tabla-productividad"></div>
    <div id="detalle-tecnico" class="detalle-tecnico"></div>

    <hr style="margin: 28px 0 20px 0" />

    <h2>Reporte por trabajo</h2>

    <div class="filtros-reportes">
      <div class="filtro-item">
        <label for="filtroTrabajoId">Número de trabajo</label><br />
        <input
          type="text"
          id="filtroTrabajoId"
          placeholder="Ej: 562"
          onkeydown="if (event.key === 'Enter') buscarReporteTrabajo();"
        />
      </div>

      <div class="filtro-item filtro-acciones">
        <button type="button" onclick="buscarReporteTrabajo()">Buscar</button>
      </div>

      <div class="filtro-item filtro-acciones">
        <button type="button" onclick="limpiarReporteTrabajo()">Limpiar</button>
      </div>
    </div>

    <div id="reporte-trabajo" class="detalle-tecnico"></div>

    <br />
    <a href="/panel" class="btn-volver">← Volver</a>

    <script>
      let ultimoResumenReportes = { tecnicos: [], trabajos: [] };
      let ultimaProductividadCalculada = {};

      function obtenerFiltrosReportes() {
        return {
          tecnico: document.getElementById("filtroTecnico")?.value || "",
          tipoResponsable:
            document.getElementById("filtroTipoResponsable")?.value || "",
          responsable:
            document.getElementById("filtroResponsable")?.value || "",
          fechaDesde: document.getElementById("filtroFechaDesde")?.value || "",
          fechaHasta: document.getElementById("filtroFechaHasta")?.value || "",
        };
      }

      function obtenerResponsableTrabajo(tr) {
        return tr.origen === "interno"
          ? tr.solicitante_nombre || tr.responsable_nombre || ""
          : tr.vendedor_nombre || tr.responsable_nombre || "";
      }

      function parseFechaSegura(fechaIso) {
        if (!fechaIso) return null;

        const fecha = new Date(fechaIso);
        if (!isNaN(fecha.getTime())) return fecha;

        const texto = String(fechaIso).trim();
        const match = texto.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return null;

        const anio = Number(match[1]);
        const mes = Number(match[2]) - 1;
        const dia = Number(match[3]);

        return new Date(anio, mes, dia, 0, 0, 0, 0);
      }

      function parseFechaInputLocal(fechaStr, finDelDia = false) {
        if (!fechaStr) return null;

        const partes = String(fechaStr).split("-");
        if (partes.length !== 3) return null;

        const anio = Number(partes[0]);
        const mes = Number(partes[1]) - 1;
        const dia = Number(partes[2]);

        if (finDelDia) {
          return new Date(anio, mes, dia, 23, 59, 59, 999);
        }

        return new Date(anio, mes, dia, 0, 0, 0, 0);
      }

      function obtenerLimitesRangoReportes() {
        const filtros = obtenerFiltrosReportes();
        let desde = parseFechaInputLocal(filtros.fechaDesde, false);
        let hasta = parseFechaInputLocal(filtros.fechaHasta, true);

        if (!desde && !hasta) {
          const hoy = new Date();
          desde = new Date(
            hoy.getFullYear(),
            hoy.getMonth(),
            hoy.getDate(),
            0,
            0,
            0,
            0,
          );
          hasta = new Date(
            hoy.getFullYear(),
            hoy.getMonth(),
            hoy.getDate(),
            23,
            59,
            59,
            999,
          );
          return { desde, hasta };
        }

        return { desde, hasta };
      }

      function actividadCruzaRango(inicioIso, finIso) {
        const { desde, hasta } = obtenerLimitesRangoReportes();

        const inicio = parseFechaSegura(inicioIso);
        const fin = parseFechaSegura(finIso);

        if (!inicio && !fin) return false;

        let inicioReal = inicio || fin;
        let finReal = fin || inicio;

        if (!inicioReal || !finReal) return false;

        if (finReal < inicioReal) {
          const temp = inicioReal;
          inicioReal = finReal;
          finReal = temp;
        }

        if (desde && finReal < desde) return false;
        if (hasta && inicioReal > hasta) return false;

        return true;
      }

      function formatearFechaActividad(fechaIso) {
        const fecha = parseFechaSegura(fechaIso);
        if (!fecha) return "";
        const dia = String(fecha.getDate()).padStart(2, "0");
        const mes = String(fecha.getMonth() + 1).padStart(2, "0");
        const anio = fecha.getFullYear();
        return `${dia}/${mes}/${anio}`;
      }

      function inicioDeHoy() {
        const hoy = new Date();
        return new Date(
          hoy.getFullYear(),
          hoy.getMonth(),
          hoy.getDate(),
          0,
          0,
          0,
          0,
        );
      }

      function redondearMinutos(valor) {
        return Math.max(0, Math.round(Number(valor || 0) * 100) / 100);
      }

      function crearRegistroTecnico(nombre) {
        return {
          nombre,
          actividades: 0,
          tiempo: 0,
          detalles: [],
          _actividadesContadas: new Set(),
          _detallesMap: new Map(),
        };
      }

      function obtenerClaveActividad(tr, act, nombreTecnico) {
        return `${tr.id || ""}__${act.id || act.descripcion || ""}__${nombreTecnico || ""}`;
      }

      function obtenerClaveDetalle(tr, act, nombreTecnico) {
        return `${tr.id || ""}__${act.id || act.descripcion || ""}__${nombreTecnico || ""}`;
      }

      function asegurarTecnico(productividad, nombreTecnico) {
        if (!nombreTecnico) return null;

        if (!productividad[nombreTecnico]) {
          productividad[nombreTecnico] = crearRegistroTecnico(nombreTecnico);
        }

        return productividad[nombreTecnico];
      }

      function registrarActividadSiNoExiste(registroTecnico, claveActividad) {
        if (!registroTecnico || !claveActividad) return;

        if (!registroTecnico._actividadesContadas.has(claveActividad)) {
          registroTecnico._actividadesContadas.add(claveActividad);
          registroTecnico.actividades += 1;
        }
      }

      function registrarDetalle(
        productividad,
        tr,
        act,
        nombreTecnico,
        detalle,
      ) {
        const registroTecnico = asegurarTecnico(productividad, nombreTecnico);
        if (!registroTecnico) return;

        const claveDetalle = obtenerClaveDetalle(tr, act, nombreTecnico);
        const existente = registroTecnico._detallesMap.get(claveDetalle);

        const prioridadEstado = (estado) => {
          const valor = String(estado || "").toLowerCase();

          if (valor === "finalizado") return 3;
          if (valor === "trabajando") return 2;
          if (valor === "pausado") return 1;
          return 0;
        };

        if (existente) {
          existente.tiempo += Number(detalle.tiempo || 0);

          if (
            prioridadEstado(detalle.estado) >= prioridadEstado(existente.estado)
          ) {
            existente.estado = detalle.estado;
          }

          if (!existente.fecha && detalle.fecha) {
            existente.fecha = detalle.fecha;
          }

          return;
        }

        const nuevoDetalle = {
          trabajoId: detalle.trabajoId || "",
          origen: detalle.origen || "",
          responsable: detalle.responsable || "",
          detalleTrabajo: detalle.detalleTrabajo || "",
          actividad: detalle.actividad || "",
          fecha: detalle.fecha || "",
          tiempo: Number(detalle.tiempo || 0),
          estado: detalle.estado || "",
        };

        registroTecnico._detallesMap.set(claveDetalle, nuevoDetalle);
        registroTecnico.detalles.push(nuevoDetalle);
      }

      async function cargarProductividad() {
        if (
          !Array.isArray(ultimoResumenReportes.tecnicos) ||
          !Array.isArray(ultimoResumenReportes.trabajos) ||
          (ultimoResumenReportes.tecnicos.length === 0 &&
            ultimoResumenReportes.trabajos.length === 0)
        ) {
          const res = await fetch("/api/resumen");
          const data = await res.json();

          ultimoResumenReportes = {
            tecnicos: data.tecnicos || [],
            trabajos: data.trabajos || [],
          };

          llenarFiltros(
            ultimoResumenReportes.tecnicos,
            ultimoResumenReportes.trabajos,
          );
        }

        recalcularProductividadDesdeMemoria();
      }

      function limpiarReporteTrabajo() {
        document.getElementById("filtroTrabajoId").value = "";
        document.getElementById("reporte-trabajo").innerHTML = "";
      }

      function limpiarReporteTrabajoSilencioso() {
        const input = document.getElementById("filtroTrabajoId");
        const cont = document.getElementById("reporte-trabajo");

        if (input) input.value = "";
        if (cont) cont.innerHTML = "";
      }

      async function buscarReporteTrabajo() {
        const input = document.getElementById("filtroTrabajoId");
        if (!input) return;

        const trabajoId = String(input.value || "").trim();
        if (!trabajoId) {
          alert("Ingresa un número de trabajo");
          return;
        }

        const cont = document.getElementById("reporte-trabajo");
        const trabajos = ultimoResumenReportes.trabajos || [];

        const trabajoEnMemoria = trabajos.find(
          (t) => String(t.id) === trabajoId,
        );

        if (trabajoEnMemoria) {
          renderReporteTrabajo(trabajoEnMemoria);
          return;
        }

        try {
          cont.innerHTML = `<p>Buscando trabajo ${trabajoId}...</p>`;

          const res = await fetch(
            `/api/trabajo/${encodeURIComponent(trabajoId)}`,
          );
          const data = await res.json();

          if (!res.ok || !data?.trabajo) {
            cont.innerHTML = `<p>No se encontró el trabajo ${trabajoId}.</p>`;
            return;
          }

          renderReporteTrabajo(data.trabajo);
        } catch (error) {
          console.error("Error buscando trabajo por ID:", error);
          cont.innerHTML = `<p>No se pudo buscar el trabajo ${trabajoId}.</p>`;
        }
      }

      function abrirDesdeDetalleTrabajo(trabajoId) {
        const input = document.getElementById("filtroTrabajoId");
        if (!input) return;

        input.value = trabajoId;

        buscarReporteTrabajo();

        // opcional: hacer scroll hacia el reporte
        const cont = document.getElementById("reporte-trabajo");
        if (cont) {
          cont.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }

      function renderReporteTrabajo(trabajo) {
        const cont = document.getElementById("reporte-trabajo");
        if (!cont) return;

        const actividades = Array.isArray(trabajo.actividades)
          ? trabajo.actividades
          : [];

        if (actividades.length === 0) {
          cont.innerHTML = `<p>El trabajo no tiene actividades.</p>`;
          return;
        }

        const resumenTecnicos = {};
        let totalTrabajo = 0;

        let html = `
    <h3>Trabajo #${trabajo.id}</h3>
    <p><strong>Descripción:</strong> ${trabajo.descripcion || ""}</p>
    <table class="tabla-reportes">
      <tr>
        <th>Actividad</th>
        <th>Técnico</th>
        <th>Tiempo</th>
      </tr>
  `;

        actividades.forEach((act) => {
          const activos = Array.isArray(act.tecnicos) ? act.tecnicos : [];
          const historial = Array.isArray(act.historial_tecnicos)
            ? act.historial_tecnicos
            : [];

          // 🔹 HISTORIAL
          historial.forEach((tec) => {
            if (!tec?.nombre) return;

            const tiempoMin =
              Math.round((Number(tec.tiempo_acumulado_seg || 0) / 60) * 100) /
              100;

            totalTrabajo += tiempoMin;

            if (!resumenTecnicos[tec.nombre]) {
              resumenTecnicos[tec.nombre] = 0;
            }

            resumenTecnicos[tec.nombre] += tiempoMin;

            html += `
        <tr>
          <td>${act.descripcion || ""}</td>
          <td>${tec.nombre}</td>
          <td>${formatearMinutos(tiempoMin)}</td>
        </tr>
      `;
          });

          // 🔹 ACTIVOS
          activos.forEach((tec) => {
            if (!tec?.nombre) return;

            let tiempoMin = Number(tec.tiempo_acumulado_seg || 0) / 60;

            if (tec.estado_en_trabajo === "trabajando" && tec.asignado_at) {
              const inicio = new Date(tec.asignado_at);
              const ahora = new Date();

              if (
                !isNaN(inicio.getTime()) &&
                !isNaN(ahora.getTime()) &&
                ahora >= inicio
              ) {
                tiempoMin += (ahora - inicio) / 60000;
              }
            }

            tiempoMin = Math.round(tiempoMin * 100) / 100;

            totalTrabajo += tiempoMin;

            if (!resumenTecnicos[tec.nombre]) {
              resumenTecnicos[tec.nombre] = 0;
            }

            resumenTecnicos[tec.nombre] += tiempoMin;

            html += `
        <tr>
          <td>${act.descripcion || ""}</td>
          <td>${tec.nombre}</td>
          <td>${formatearMinutos(tiempoMin)}</td>
        </tr>
      `;
          });
        });

        html += `</table>`;

        // 🔥 RESUMEN POR TÉCNICO
        html += `
    <h4 style="margin-top:20px;">Resumen por técnico</h4>
    <table class="tabla-reportes">
      <tr>
        <th>Técnico</th>
        <th>Tiempo total</th>
      </tr>
  `;

        Object.entries(resumenTecnicos).forEach(([nombre, tiempo]) => {
          html += `
      <tr>
        <td>${nombre}</td>
        <td>${formatearMinutos(tiempo)}</td>
      </tr>
    `;
        });

        html += `</table>`;

        // 🔥 TOTAL GENERAL
        html += `
    <h4 style="margin-top:20px;">
      Total del trabajo: ${formatearMinutos(totalTrabajo)}
    </h4>
  `;

        cont.innerHTML = html;
      }

      async function cargarResumenPorFecha() {
        const desde = document.getElementById("filtroFechaDesde")?.value;

        let url = "/api/resumen";

        if (desde) {
          url = `/api/resumen?fecha=${desde}`;
        }

        const res = await fetch(url);
        const data = await res.json();

        ultimoResumenReportes = {
          tecnicos: data.tecnicos || [],
          trabajos: data.trabajos || [],
        };

        llenarFiltros(
          ultimoResumenReportes.tecnicos,
          ultimoResumenReportes.trabajos,
        );

        recalcularProductividadDesdeMemoria();
      }
      function recalcularProductividadDesdeMemoria() {
        limpiarReporteTrabajoSilencioso();
        const filtros = obtenerFiltrosReportes();
        const tecnicos = ultimoResumenReportes.tecnicos || [];
        const trabajos = ultimoResumenReportes.trabajos || [];
        const productividad = {};

        tecnicos.forEach((t) => {
          if (!t?.nombre) return;
          productividad[t.nombre] = crearRegistroTecnico(t.nombre);
        });

        trabajos.forEach((tr) => {
          if (!tr) return;

          if (
            filtros.tipoResponsable &&
            (tr.origen || "") !== filtros.tipoResponsable
          ) {
            return;
          }

          const responsableTrabajo = obtenerResponsableTrabajo(tr);
          if (
            filtros.responsable &&
            responsableTrabajo !== filtros.responsable
          ) {
            return;
          }

          const actividades = Array.isArray(tr.actividades)
            ? tr.actividades
            : [];

          actividades.forEach((act) => {
            const historial = Array.isArray(act.historial_tecnicos)
              ? act.historial_tecnicos
              : [];
            const activos = Array.isArray(act.tecnicos) ? act.tecnicos : [];

            const tecnicosActivosEnActividad = new Set(
              activos
                .filter((t) => t?.nombre)
                .map((t) => `${Number(t.id) || 0}__${t.nombre}`),
            );

            historial.forEach((tec) => {
              if (!tec?.nombre) return;
              const claveTecnicoActivo = `${Number(tec.id) || 0}__${tec.nombre}`;
              if (tecnicosActivosEnActividad.has(claveTecnicoActivo)) {
                return;
              }

              const inicioHistorial =
                tec.asignado_at ||
                tec.iniciado_at ||
                tec.inicio_at ||
                act.inicio_proceso_at ||
                act.created_at ||
                act.finalizado_at;

              const finHistorial =
                tec.finalizado_at ||
                tec.pausado_at ||
                act.finalizado_at ||
                inicioHistorial;

              if (!actividadCruzaRango(inicioHistorial, finHistorial)) {
                return;
              }

              const registroTecnico = asegurarTecnico(
                productividad,
                tec.nombre,
              );
              if (!registroTecnico) return;

              const tiempoMin = redondearMinutos(
                Number(tec.tiempo_acumulado_seg || 0) / 60,
              );

              const claveActividad = obtenerClaveActividad(tr, act, tec.nombre);
              registrarActividadSiNoExiste(registroTecnico, claveActividad);

              registroTecnico.tiempo += tiempoMin;

              registrarDetalle(productividad, tr, act, tec.nombre, {
                trabajoId: tr.id || "",
                origen: tr.origen === "interno" ? "Interno" : "Vendedor",
                responsable: responsableTrabajo || "",
                detalleTrabajo: tr.descripcion || "",
                actividad: act.descripcion || "",
                fecha: formatearFechaActividad(inicioHistorial),
                tiempo: tiempoMin,
                estado: act.estado || "pendiente",
              });
            });

            activos.forEach((tec) => {
              if (!tec?.nombre) return;

              const inicioActivo =
                tec.asignado_at ||
                act.inicio_proceso_at ||
                act.created_at ||
                act.finalizado_at;

              const finActivo =
                tec.estado_en_trabajo === "trabajando"
                  ? new Date().toISOString()
                  : tec.liberado_at ||
                    tec.pausado_at ||
                    tec.finalizado_at ||
                    act.finalizado_at ||
                    inicioActivo;

              if (!actividadCruzaRango(inicioActivo, finActivo)) {
                return;
              }

              const registroTecnico = asegurarTecnico(
                productividad,
                tec.nombre,
              );
              if (!registroTecnico) return;

              let tiempoMin = Number(tec.tiempo_acumulado_seg || 0) / 60;

              if (tec.estado_en_trabajo === "trabajando" && tec.asignado_at) {
                const inicio = new Date(tec.asignado_at);
                const ahora = new Date();
                const hoyInicio = inicioDeHoy();
                const desde = inicio < hoyInicio ? hoyInicio : inicio;

                if (
                  !isNaN(desde.getTime()) &&
                  !isNaN(ahora.getTime()) &&
                  ahora >= desde
                ) {
                  tiempoMin += (ahora - desde) / 60000;
                }
              }

              tiempoMin = redondearMinutos(tiempoMin);

              const claveActividad = obtenerClaveActividad(tr, act, tec.nombre);
              registrarActividadSiNoExiste(registroTecnico, claveActividad);

              registroTecnico.tiempo += tiempoMin;

              registrarDetalle(productividad, tr, act, tec.nombre, {
                trabajoId: tr.id || "",
                origen: tr.origen === "interno" ? "Interno" : "Vendedor",
                responsable: responsableTrabajo || "",
                detalleTrabajo: tr.descripcion || "",
                actividad: act.descripcion || "",
                fecha: formatearFechaActividad(inicioActivo),
                tiempo: tiempoMin,
                estado: act.estado || "en_proceso",
              });
            });
          });
        });

        Object.values(productividad).forEach((t) => {
          t.tiempo = redondearMinutos(t.tiempo);

          t.detalles.forEach((d) => {
            d.tiempo = redondearMinutos(d.tiempo);
          });

          t.detalles.sort((a, b) => {
            if ((b.tiempo || 0) !== (a.tiempo || 0)) {
              return (b.tiempo || 0) - (a.tiempo || 0);
            }
            return String(a.trabajoId || "").localeCompare(
              String(b.trabajoId || ""),
              "es",
              { numeric: true, sensitivity: "base" },
            );
          });

          delete t._actividadesContadas;
          delete t._detallesMap;
        });

        ultimaProductividadCalculada = productividad;
        renderResumenGeneralReportes();
        renderTabla(productividad);

        const tecnicoSeleccionado = filtros.tecnico;
        if (tecnicoSeleccionado && productividad[tecnicoSeleccionado]) {
          verDetalleTecnico(tecnicoSeleccionado);
        } else {
          document.getElementById("detalle-tecnico").innerHTML = "";
        }
      }

      function limpiarFiltrosReportes() {
        document.getElementById("filtroTecnico").value = "";
        document.getElementById("filtroTipoResponsable").value = "";
        document.getElementById("filtroResponsable").value = "";
        document.getElementById("filtroFechaDesde").value = "";
        document.getElementById("filtroFechaHasta").value = "";

        const inputRango = document.getElementById("filtroFechaRango");
        if (inputRango) inputRango.value = "";

        if (typeof pickerFechaRango !== "undefined" && pickerFechaRango) {
          pickerFechaRango.clear();
        }

        limpiarDetalleTecnico();
        recalcularProductividadDesdeMemoria();
      }

      function formatearMinutos(min) {
        const totalMin = Math.max(0, Math.round(Number(min || 0)));
        const h = Math.floor(totalMin / 60);
        const m = totalMin % 60;
        return `${h}h ${m}m`;
      }

      function seleccionarTecnicoDesdeTabla(nombreTecnico) {
        const selectTecnico = document.getElementById("filtroTecnico");
        if (!selectTecnico) return;

        selectTecnico.value = nombreTecnico;
        recalcularProductividadDesdeMemoria();
      }

      function renderResumenGeneralReportes() {
        const cont = document.getElementById("resumen-general-reportes");
        if (!cont) return;

        const filtros = obtenerFiltrosReportes();
        const trabajos = Array.isArray(ultimoResumenReportes.trabajos)
          ? ultimoResumenReportes.trabajos
          : [];

        let trabajosTotales = 0;
        let actividadesTotales = 0;

        trabajos.forEach((tr) => {
          if (!tr) return;

          if (
            filtros.tipoResponsable &&
            (tr.origen || "") !== filtros.tipoResponsable
          ) {
            return;
          }

          const responsableTrabajo = obtenerResponsableTrabajo(tr);
          if (
            filtros.responsable &&
            responsableTrabajo !== filtros.responsable
          ) {
            return;
          }

          const actividades = Array.isArray(tr.actividades)
            ? tr.actividades
            : [];

          let trabajoCuenta = false;

          actividades.forEach((act) => {
            const historial = Array.isArray(act.historial_tecnicos)
              ? act.historial_tecnicos
              : [];
            const activos = Array.isArray(act.tecnicos) ? act.tecnicos : [];

            let actividadCuenta = false;

            historial.forEach((tec) => {
              if (!tec?.nombre) return;
              if (filtros.tecnico && tec.nombre !== filtros.tecnico) return;

              const inicioHistorial =
                tec.asignado_at ||
                tec.iniciado_at ||
                tec.inicio_at ||
                act.inicio_proceso_at ||
                act.created_at ||
                act.finalizado_at;

              const finHistorial =
                tec.finalizado_at ||
                tec.pausado_at ||
                act.finalizado_at ||
                inicioHistorial;

              if (!actividadCruzaRango(inicioHistorial, finHistorial)) return;

              actividadCuenta = true;
            });

            activos.forEach((tec) => {
              if (!tec?.nombre) return;
              if (filtros.tecnico && tec.nombre !== filtros.tecnico) return;

              const inicioActivo =
                tec.asignado_at ||
                act.inicio_proceso_at ||
                act.created_at ||
                act.finalizado_at;

              const finActivo =
                tec.estado_en_trabajo === "trabajando"
                  ? new Date().toISOString()
                  : tec.liberado_at ||
                    tec.pausado_at ||
                    tec.finalizado_at ||
                    act.finalizado_at ||
                    inicioActivo;

              if (!actividadCruzaRango(inicioActivo, finActivo)) return;

              actividadCuenta = true;
            });

            if (actividadCuenta) {
              actividadesTotales += 1;
              trabajoCuenta = true;
            }
          });

          if (trabajoCuenta) {
            trabajosTotales += 1;
          }
        });

        cont.innerHTML = `
    <div class="tabla-reportes" style="margin-bottom: 16px;">
      <table class="tabla-reportes">
        <tr>
          <th>Trabajos totales</th>
          <th>Actividades totales</th>
        </tr>
        <tr>
          <td>${trabajosTotales}</td>
          <td>${actividadesTotales}</td>
        </tr>
      </table>
    </div>
  `;
      }

      function renderTabla(data) {
        const cont = document.getElementById("tabla-productividad");
        const filtros = obtenerFiltrosReportes();

        let html = `
          <table class="tabla-reportes">
            <tr>
              <th>Técnico</th>
              <th>Actividades</th>
              <th>Tiempo trabajado</th>
              <th>Promedio por actividad</th>
            </tr>
        `;

        let filasMostradas = 0;
        const hayFiltrosActivos =
          !!filtros.tecnico ||
          !!filtros.responsable ||
          !!filtros.fechaDesde ||
          !!filtros.fechaHasta;

        Object.values(data)
          .filter((t) => {
            if (filtros.tecnico && t.nombre !== filtros.tecnico) return false;

            if (hayFiltrosActivos) {
              return t.actividades > 0 || t.tiempo > 0;
            }

            return true;
          })
          .sort((a, b) => {
            if (b.actividades !== a.actividades) {
              return b.actividades - a.actividades;
            }
            return b.tiempo - a.tiempo;
          })
          .forEach((t) => {
            const promedio = t.actividades > 0 ? t.tiempo / t.actividades : 0;
            filasMostradas += 1;

            html += `
              <tr onclick="seleccionarTecnicoDesdeTabla('${String(t.nombre || "").replace(/'/g, "\\'")}')" class="fila-seleccionable">
                <td>${t.nombre}</td>
                <td>${t.actividades}</td>
                <td>${formatearMinutos(t.tiempo)}</td>
                <td>${formatearMinutos(promedio)}</td>
              </tr>
            `;
          });

        if (filasMostradas === 0) {
          html += `
            <tr>
              <td colspan="4">No hay resultados con los filtros seleccionados.</td>
            </tr>
          `;
        }

        html += `</table>`;

        cont.innerHTML = html;
      }

      function llenarFiltros(tecnicos, trabajos) {
        const selectTecnico = document.getElementById("filtroTecnico");
        const selectTipoResponsable = document.getElementById(
          "filtroTipoResponsable",
        );
        const selectResponsable = document.getElementById("filtroResponsable");

        if (!selectTecnico || !selectTipoResponsable || !selectResponsable) {
          return;
        }

        const tecnicoActual = selectTecnico.value;
        const tipoResponsableActual = selectTipoResponsable.value;
        const responsableActual = selectResponsable.value;

        const nombresTecnicos = new Set();
        tecnicos.forEach((t) => {
          if (t.nombre) nombresTecnicos.add(t.nombre);
        });

        selectTecnico.innerHTML = `<option value="">Todos</option>`;
        Array.from(nombresTecnicos)
          .sort()
          .forEach((nombre) => {
            selectTecnico.innerHTML += `<option value="${nombre}">${nombre}</option>`;
          });

        if (
          tecnicoActual &&
          Array.from(nombresTecnicos).includes(tecnicoActual)
        ) {
          selectTecnico.value = tecnicoActual;
        }

        const vendedores = new Set();
        const internos = new Set();

        trabajos.forEach((tr) => {
          if ((tr.origen || "").toLowerCase() === "interno") {
            const nombreInterno =
              tr.solicitante_nombre || tr.responsable_nombre || "";
            if (nombreInterno) internos.add(nombreInterno);
          } else {
            const nombreVendedor =
              tr.vendedor_nombre || tr.responsable_nombre || "";
            if (nombreVendedor) vendedores.add(nombreVendedor);
          }
        });

        selectTipoResponsable.innerHTML = `
          <option value="">Todos</option>
          <option value="vendedor">Vendedores</option>
          <option value="interno">Interno</option>
        `;

        if (
          tipoResponsableActual &&
          ["vendedor", "interno"].includes(tipoResponsableActual)
        ) {
          selectTipoResponsable.value = tipoResponsableActual;
        }

        let responsablesFiltrados = [];

        if (selectTipoResponsable.value === "vendedor") {
          responsablesFiltrados = Array.from(vendedores).sort();
        } else if (selectTipoResponsable.value === "interno") {
          responsablesFiltrados = Array.from(internos).sort();
        } else {
          responsablesFiltrados = Array.from(
            new Set([...vendedores, ...internos]),
          ).sort();
        }

        selectResponsable.innerHTML = `<option value="">Todos</option>`;
        responsablesFiltrados.forEach((nombre) => {
          selectResponsable.innerHTML += `<option value="${nombre}">${nombre}</option>`;
        });

        if (
          responsableActual &&
          responsablesFiltrados.includes(responsableActual)
        ) {
          selectResponsable.value = responsableActual;
        }
      }

      function verDetalleTecnico(nombreTecnico) {
        const cont = document.getElementById("detalle-tecnico");
        if (!cont) return;

        const tecnico = ultimaProductividadCalculada[nombreTecnico];

        if (
          !tecnico ||
          !Array.isArray(tecnico.detalles) ||
          tecnico.detalles.length === 0
        ) {
          cont.innerHTML = `
            <h3>Detalle de ${nombreTecnico}</h3>
            <p>No hay actividades registradas con los filtros seleccionados.</p>
          `;
          return;
        }

        const filas = tecnico.detalles
          .map((detalle) => {
            const trabajoIdSeguro = String(detalle.trabajoId || "").replace(
              /'/g,
              "\\'",
            );

            return `
      <tr
        class="fila-seleccionable ${(detalle.origen || "").toLowerCase() === "interno" ? "fila-interna" : ""}"
        ${detalle.trabajoId ? `onclick="abrirDesdeDetalleTrabajo('${trabajoIdSeguro}')"` : ""}
      >
        <td>${detalle.trabajoId || ""}</td>
        <td>${detalle.origen || ""}</td>
        <td>${detalle.responsable || ""}</td>
        <td>${detalle.detalleTrabajo || ""}</td>
        <td>${detalle.actividad || ""}</td>
        <td>${detalle.fecha || ""}</td>
        <td>${formatearMinutos(detalle.tiempo || 0)}</td>
        <td>${detalle.estado || ""}</td>
      </tr>
    `;
          })
          .join("");

        cont.innerHTML = `
          <h3>Detalle de ${nombreTecnico}</h3>
          <div class="tabla-scroll-wrap">
            <table class="tabla-reportes tabla-detalle">
              <tr>
                <th>Trabajo</th>
                <th>Origen</th>
                <th>Responsable</th>
                <th>Detalle trabajo</th>
                <th>Actividad</th>
                <th>Fecha</th>
                <th>Tiempo</th>
                <th>Estado</th>
              </tr>
              ${filas}
            </table>
          </div>
        `;
      }

      function limpiarDetalleTecnico() {
        const cont = document.getElementById("detalle-tecnico");
        if (!cont) return;
        cont.innerHTML = "";
      }

      const pickerFechaRango = flatpickr("#filtroFechaRango", {
        mode: "range",
        dateFormat: "Y-m-d",
        locale: flatpickr.l10ns.es,
        allowInput: false,
        onClose: function (selectedDates) {
          const inputDesde = document.getElementById("filtroFechaDesde");
          const inputHasta = document.getElementById("filtroFechaHasta");

          if (!inputDesde || !inputHasta) return;

          if (!selectedDates || selectedDates.length === 0) {
            inputDesde.value = "";
            inputHasta.value = "";
            cargarResumenPorFecha();
            return;
          }

          const formatearFecha = (fecha) => {
            const anio = fecha.getFullYear();
            const mes = String(fecha.getMonth() + 1).padStart(2, "0");
            const dia = String(fecha.getDate()).padStart(2, "0");
            return `${anio}-${mes}-${dia}`;
          };

          inputDesde.value = formatearFecha(selectedDates[0]);
          inputHasta.value =
            selectedDates.length > 1
              ? formatearFecha(selectedDates[1])
              : formatearFecha(selectedDates[0]);

          cargarResumenPorFecha();
        },
      });

      window.addEventListener("DOMContentLoaded", async () => {
        await cargarProductividad();
      });
    </script>
  </body>
</html>
