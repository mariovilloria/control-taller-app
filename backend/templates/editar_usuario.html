<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar usuario</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 560px;
        background: #ffffff;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h2 {
        margin: 0 0 24px 0;
      }

      .form-group {
        margin-bottom: 18px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: bold;
      }

      .form-group input[type="text"],
      .form-group input[type="password"] {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
      }

      .form-group input[disabled] {
        background: #f3f4f6;
        color: #6b7280;
        cursor: not-allowed;
      }

      .check-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .acciones {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }

      .btn {
        flex: 1;
        height: 46px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-guardar {
        background: #2563eb;
        color: #ffffff;
      }

      .btn-volver {
        background: #e5e7eb;
        color: #111827;
      }

      .ayuda {
        margin-top: 6px;
        font-size: 12px;
        color: #6b7280;
      }

      @media (max-width: 520px) {
        .card {
          padding: 22px 18px;
        }

        .acciones {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h2>Editar usuario</h2>

        <form method="POST" action="/usuarios/{{ usuario.id }}/actualizar">
          <div class="form-group">
            <label>Usuario</label>
            <input type="text" value="{{ usuario.usuario }}" disabled />
          </div>

          <div class="form-group">
            <label>Nombre</label>
            <input
              type="text"
              name="nombre"
              value="{{ usuario.nombre }}"
              required
            />
          </div>

          {% if usuario.id == session["usuario_id"] %}
          <div class="check-group">
            <input type="checkbox" checked disabled />
            <label>Es administrador</label>
          </div>

          <div class="check-group">
            <input type="checkbox" checked disabled />
            <label>Puede gestionar</label>
          </div>

          <div class="check-group">
            <input type="checkbox" checked disabled />
            <label>Activo</label>
          </div>
          {% else %}
          <div class="check-group">
            <input
              type="checkbox"
              id="es_admin"
              name="es_admin"
              {%
              if
              usuario.es_admin
              %}checked{%
              endif
              %}
            />
            <label for="es_admin">Es administrador</label>
          </div>

          <div class="check-group">
            <input
              type="checkbox"
              id="puede_gestionar"
              name="puede_gestionar"
              {%
              if
              usuario.puede_gestionar
              %}checked{%
              endif
              %}
            />
            <label for="puede_gestionar">Puede gestionar</label>
          </div>

          <div class="check-group">
            <input
              type="checkbox"
              id="activo"
              name="activo"
              {%
              if
              usuario.activo
              %}checked{%
              endif
              %}
            />
            <label for="activo">Activo</label>
          </div>
          {% endif %}

          <div class="acciones">
            <button type="submit" class="btn btn-guardar">
              Guardar cambios
            </button>
            <a href="/usuarios" class="btn btn-volver">Volver</a>
          </div>
        </form>
        {% if usuario.id != session["usuario_id"] %}
        <div
          style="
            margin-top: 18px;
            padding: 14px;
            background: #fff7ed;
            border: 1px solid #fdba74;
            border-radius: 10px;
          "
        >
          <div style="font-weight: bold; margin-bottom: 8px">
            Resetear clave
          </div>
          <div style="font-size: 13px; color: #9a3412; margin-bottom: 12px">
            Esto cambiará la clave del usuario a 1234.
          </div>

          <form
            method="POST"
            action="/usuarios/{{ usuario.id }}/resetear-clave"
            onsubmit="
              return confirm(
                '⚠️ Esta acción reseteará la clave del usuario a 1234.\n\n¿Deseas continuar?',
              );
            "
          >
            <button
              type="submit"
              style="
                height: 40px;
                padding: 0 14px;
                border: none;
                border-radius: 10px;
                background: #ea580c;
                color: #ffffff;
                font-weight: bold;
                cursor: pointer;
              "
            >
              Resetear clave a 1234
            </button>
          </form>
        </div>
        {% endif %}
      </div>
    </div>
  </body>
</html>
